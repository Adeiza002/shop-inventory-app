<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Inventory App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>📦 Shop Inventory</h1>
  </header>

  <!-- Summary dashboard -->
  <section class="summary">
    <div class="summary-card">
      <h3>Total Items</h3>
      <p id="totalItems">0</p>
    </div>
    <div class="summary-card">
      <h3>Total Inventory Value</h3>
      <p id="totalValue">₦0</p>
    </div>
    <div class="summary-card low-stock-card">
      <h3>Low Stock Items</h3>
      <p id="lowStockCount">0</p>
    </div>
  </section>

  <!-- Controls: search, filter, add button -->
  <section class="controls">
    <input type="text" id="searchInput" placeholder="Search items..." />
    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>
    <button id="addItemBtn">+ Add Item</button>
  </section>

  <!-- Items table -->
  <section class="table-wrapper">
    <table id="itemsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Quantity</th>
          <th>Threshold</th>
          <th>Unit Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="itemsTableBody">
        <!-- Items will be inserted here by JavaScript -->
      </tbody>
    </table>
    <p id="emptyState" class="empty-state">No items yet. Click "+ Add Item" to get started.</p>
  </section>

  <!-- Add/Edit Item Modal -->
  <div id="itemModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modalTitle">Add Item</h2>
      <form id="itemForm">
        <input type="hidden" id="itemId" />

        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" required />

        <label for="itemCategory">Category</label>
        <input type="text" id="itemCategory" placeholder="e.g. Grains, Drinks" />

        <label for="itemQuantity">Quantity</label>
        <input type="number" id="itemQuantity" min="0" required />

        <label for="itemThreshold">Low Stock Threshold</label>
        <input type="number" id="itemThreshold" min="0" required />

        <label for="itemPrice">Unit Price (₦)</label>
        <input type="number" id="itemPrice" min="0" step="0.01" />

        <div class="modal-actions">
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" id="saveBtn">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
